services:
  - type: web
    name: random-whatsapp-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DB_PATH
        value: /var/data/bot.db
